name: VapeCareTracker
options:
  bundleIdPrefix: com.local
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.0"

settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    ENABLE_USER_SCRIPT_SANDBOXING: NO

targets:
  VapeCareTracker:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: VapeCareTracker
    dependencies:
      - target: VapeCareWidget
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.local.vapecare
        PRODUCT_NAME: VapeCareTracker
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: "VapeCare"
        UILaunchStoryboardName: "LaunchScreen"
        INFOPLIST_KEY_UILaunchStoryboardName: "LaunchScreen"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UIRequiresFullScreen: YES
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_STYLE: Manual
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 1.0.0

  VapeCareWidget:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: VapeCareWidget
      - path: VapeCareTracker/Services/WidgetDataStore.swift
    info:
      path: VapeCareWidget/Info.plist
      properties:
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.local.vapecare.widget
        PRODUCT_NAME: VapeCareWidget
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_STYLE: Manual
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 1.0.0
